[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthline-ai"
version = "0.2.1"
description = "Synthetic visual-data generation for computer-vision teams."
readme = "README_PYPI.md"
license = { text = "Apache-2.0" }
authors = [{ name = "SynthLine AI Team", email = "hello@synthline.ai" }]
keywords = [
    "synthetic-data",
    "computer-vision",
    "defect-detection",
    "dataset-generator",
    "coco",
    "yolo",
    "machine-vision",
    "data-augmentation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "scikit-image>=0.21",
    "pydantic>=2.0",
    "typer[all]>=0.9",
    "rich>=13.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.6",
]

[project.urls]
Homepage = "https://github.com/thrivecodes/synthline-ai"
Repository = "https://github.com/thrivecodes/synthline-ai.git"
Issues = "https://github.com/thrivecodes/synthline-ai/issues"
Changelog = "https://github.com/thrivecodes/synthline-ai/blob/main/CHANGELOG.md"


[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
    "httpx>=0.24",
    "scikit-learn>=1.3",
]
probe = ["scikit-learn>=1.3"]


[project.scripts]
synthline = "synthline_ai.cli:app"
synthline-ai = "synthline_ai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/synthline_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # Allow typer.Option in CLI default arguments


[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

